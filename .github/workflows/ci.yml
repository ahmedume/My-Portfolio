name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only ever read the repo. Publishing needs its own token, see deploy-pages.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build static site
        run: npm run build:static

      - name: Assert production base path is baked in
        # vite.config.ts sets base="/" for builds, so index.html must reference
        # assets from the site root. If base regresses, every asset 404s in
        # production, so fail here instead. Keep in sync with PAGES_BASE.
        run: |
          grep -q 'src="/assets/' dist/index.html
          if grep -q '/My-Portfolio/' dist/index.html; then
            echo "::error::build still uses the /My-Portfolio/ base path"
            exit 1
          fi

      - name: Assert the custom domain is published
        # Pages reads CNAME from the build output, not the repo root. Without
        # this the domain silently reverts to the github.io URL each deploy.
        run: test -f dist/CNAME

      - name: Assert no secrets in the published bundle
        # The Pages build is fully static, so no API key may reach dist/.
        # Deliberately does not echo any matched value.
        run: |
          if grep -rIlE 'gsk_[A-Za-z0-9]|sk-[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{20}|GROQ_API_KEY|GOOGLE_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY' dist/; then
            echo "::error::possible secret material found in dist/"
            exit 1
          fi
          echo "no secret patterns in dist/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
